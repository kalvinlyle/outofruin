		/* The game fills the window and picks its own shape inside the frame,
		   so the page just hands it everything there is. On a phone that is the
		   whole screen; on a desktop the masthead shows around it. */
		.game-stage {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			height: 100dvh;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: rgb( 0, 0, 0 );
			background-image: url("img/masthead.jpg");
			background-size: cover;
			background-position: center;
		}

		/* The game shapes itself to the frame between 20:9 and 3:4, so the frame
		   is given the same limits: on a phone it is the whole screen, and on a
		   desktop it stops at 3:4 and the masthead shows around it. */
		.game-stage iframe {
			display: block;
			border: 0;
			width: 100vw;
			width: min(100vw, 75vh);
			width: min(100dvw, 75dvh);
			height: 100vh;
			height: min(100vh, 222.3vw);
			height: min(100dvh, 222.3dvw);
		}
	</style>
