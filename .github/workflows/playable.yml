name: Playable Ad

on:
  pull_request:
    branches: [master]
    paths:
      - "playable/**"
      - "ads/playable/**"
      - ".github/workflows/playable.yml"
  push:
    branches: [master]
    paths:
      - "playable/**"
      - "ads/playable/**"
      - ".github/workflows/playable.yml"
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playable/package-lock.json

      - name: Install system tools (ffmpeg, pillow)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet pillow

      - name: Install playable dependencies and Chromium
        working-directory: playable
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify committed playable artifact
        working-directory: playable
        run: npm run test:playable

      - name: Rebuild playable from source
        working-directory: playable
        run: npm run build:playable

      - name: Verify rebuilt playable (smoke, sadbundle stall FCP, audio silence spy, analytics)
        working-directory: playable
        run: npm run test:playable

      - name: Upload playable artifact
        uses: actions/upload-artifact@v4
        with:
          name: out-of-ruin-playable
          path: ads/playable/out-of-ruin.html
          if-no-files-found: error
