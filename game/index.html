<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, minimal-ui, shrink-to-fit=no">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="Out of Ruin">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="theme-color" content="#1e2226">
	<title>Out of Ruin</title>
	<!-- The app icon (store/icon.png): browser tab, home-screen shortcut and installed web app. -->
	<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
	<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
	<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
	<link rel="manifest" href="manifest.webmanifest">
	<style type='text/css'>
	/* Same page layout as the Defold build's page (tag defold-final), so the canvas lands on the same pixels. */
	body {
		position: fixed; /* Prevent overscroll */
		margin:0;
		padding:0;
	}
	.canvas-app-container {
		width: 100%;
		height: 100%;
		position: absolute;
		align-items: center;
		justify-content: center;
		overflow: hidden;
	}
	#canvas {
		outline: none;
		border: 0;
		width: 100%;
		height: 100%;
		display: block;
		vertical-align: bottom;
	}
	canvas:focus, canvas:active {
		outline: none;
		border: 0;
	}
	div {
		-webkit-tap-highlight-color: rgba(0,0,0,0);
		-webkit-touch-callout: none;
		-webkit-user-select: none;
		-moz-user-select: none;
		-ms-user-select: none;
		user-select: none;
	}
	.buttons-background {
		background-color: #1e2226;
		width: 100%;
		height: 42px;
	}
	body {
		background-color: #1e2226;
	}
	.canvas-app-container {
		background: rgba(36,41,46,1);
		background: linear-gradient(135deg, rgba(36,41,46,1) 0%, rgba(36,41,46,1) 49%, rgba(38,43,49,1) 50%, rgba(38,43,49,1) 100%);
	}
	.canvas-app-canvas {
		background-repeat:no-repeat;
		background-position: center center;
		background-image: url("splash.png");
	}
	.canvas-app-progress {
		position: absolute;
		background-color: #394046;
		height: 6px;
		margin-top: -6px;
		width: 100%;
	}
	.canvas-app-progress-bar {
		font-size: 12px;
		height: 6px;
		color: rgb(255, 255, 255);
		background-color: #1a72eb;
		text-align: center;
		line-height: 20px;
	}
	.rotate-overlay {
		display: none;
		position: fixed;
		inset: 0;
		z-index: 9999;
		background-color: #1e2226;
		align-items: center;
		justify-content: center;
		color: #e6dfd1;
		touch-action: none;
	}
	.rotate-overlay svg {
		width: 88px;
		height: 88px;
	}
	.rotate-overlay .rotate-arrows {
		opacity: 0.65;
	}
	.rotate-overlay .rotate-phone {
		transform-origin: 48px 48px;
		animation: rotate-to-portrait 2.4s ease-in-out infinite;
	}
	@keyframes rotate-to-portrait {
		0% {
			transform: rotate(90deg);
			opacity: 0;
		}
		14% {
			transform: rotate(90deg);
			opacity: 1;
		}
		52%, 82% {
			transform: rotate(0deg);
			opacity: 1;
		}
		96%, 100% {
			transform: rotate(0deg);
			opacity: 0;
		}
	}
	@media (prefers-reduced-motion: reduce) {
		.rotate-overlay .rotate-phone {
			animation: none;
			transform: rotate(45deg);
		}
	}
	@media (orientation: landscape) and (pointer: coarse) and (max-height: 600px) {
		#app-container {
			visibility: hidden;
		}
		.rotate-overlay {
			display: flex;
		}
	}
	</style>
</head>

<body>
	<div id="rotate-overlay" class="rotate-overlay" role="status" aria-label="Rotate your phone to portrait">
		<svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
			<g class="rotate-arrows" stroke-width="2.75">
				<path d="M 84.7 38.2 A 38 38 0 0 0 57.8 11.3"/>
				<path d="M 65.2 8.2 L 57.8 11.3 L 62.6 17.7"/>
				<path d="M 11.3 57.8 A 38 38 0 0 0 38.2 84.7"/>
				<path d="M 30.8 87.8 L 38.2 84.7 L 33.4 78.3"/>
			</g>
			<g class="rotate-phone">
				<rect x="32" y="21" width="32" height="54" rx="5.5" ry="5.5" stroke-width="3"/>
				<line x1="43" y1="26.5" x2="53" y2="26.5" stroke-width="2.2"/>
				<line x1="43" y1="69.5" x2="53" y2="69.5" stroke-width="2.2"/>
			</g>
		</svg>
	</div>
	<div id="app-container" class="canvas-app-container">
		<canvas id="canvas" class="canvas-app-canvas" tabindex="1" width="750" height="1334"></canvas>
		<div id="canvas-app-progress" class="canvas-app-progress"><div id="canvas-app-progress-bar" class="canvas-app-progress-bar" style="width: 0%;"></div></div>
		<div class="buttons-background">
		</div>
	</div>
	<script type='text/javascript'>
		// dmloader's splash and progress bar: the engine reports download progress
		// and calls done() once the game is running.
		window.__portLoader = {
			progress: function (f) {
				var bar = document.getElementById('canvas-app-progress-bar');
				if (bar) bar.style.width = Math.min(100, f * 100) + '%';
			},
			done: function () {
				var p = document.getElementById('canvas-app-progress');
				if (p && p.parentElement) p.parentElement.removeChild(p);
				document.getElementById('canvas').style.backgroundImage = 'none';
			}
		};
	</script>
	<script type='text/javascript'>
		// Localisation was fetched from the Google Sheets v3 feed API, shut down in 2021.
		// loc.json is a snapshot of that feed.
		(function() {
			var open = XMLHttpRequest.prototype.open;
			XMLHttpRequest.prototype.open = function(method, url) {
				if (typeof url === 'string' && url.indexOf('spreadsheets.google.com/feeds/list/') !== -1) {
					arguments[1] = 'loc.json';
				}
				return open.apply(this, arguments);
			};
		})();
	</script>
	<script type='text/javascript' src="packs.js"></script>
	<script type='text/javascript' src="store.js"></script>
	<script type='text/javascript'>
	var is_iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
	var buttonHeight = 0;
	var MIN_ASPECT = 0.45;  // 20:9, the tallest phones
	var MAX_ASPECT = 0.75;  // 3:4, a tablet in portrait

	function resize_game_canvas() {
		if (is_iOS) {
			window.scrollTo(0, 0);
		}
		var app_container = document.getElementById('app-container');
		var game_canvas = document.getElementById('canvas');
		var innerWidth = window.innerWidth;
		var innerHeight = window.innerHeight - buttonHeight;
		var windowAspect = innerWidth / innerHeight;
		var aspect = Math.min(Math.max(windowAspect, MIN_ASPECT), MAX_ASPECT);
		var width = innerWidth;
		var height = innerHeight;
		if (windowAspect > aspect) {
			width = Math.round(innerHeight * aspect);
		} else if (windowAspect < aspect) {
			height = Math.round(innerWidth / aspect);
		}
		app_container.style.marginLeft = ((innerWidth - width) / 2) + "px";
		app_container.style.marginTop = ((innerHeight - height) / 2) + "px";
		app_container.style.width = width + "px";
		app_container.style.height = height + buttonHeight + "px";
		game_canvas.width = width;
		game_canvas.height = height;
	}
	resize_game_canvas();
	window.addEventListener('resize', resize_game_canvas, false);
	window.addEventListener('orientationchange', resize_game_canvas, false);
	</script>

	<script type='text/javascript'>
		// Kongregate's API is for the Kongregate web portal only. The native app must not
		// wait on a remote script to boot, so it never loads it.
		if (!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
			document.write("<script src='https://cdn1.kongregate.com/javascripts/kongregate_api.js'><\/script>");
		}
	</script>
	<script id='kongwrapper' type='text/javascript'>
		function loadKongregate() {
			kongregateAPI.loadAPI(
				function() {
					kongregate = kongregateAPI.getAPI();
					console.log("Kongregate API Loaded");
					JsToDef.send("kongIsLoaded")
				}
			);
		}
		function onReturnItemList(result)		{	console.log("Return Item List success:" + result.success);	JsToDef.send("onReturnItemList", result); }
		function onPurchaseResult(result)		{	console.log("Purchase success:" + result.success);					JsToDef.send("onPurchaseResult", result); }
		function onUserItems(result)				{	console.log("Return User Items success:" + result.success); JsToDef.send("onUserItems", result);			}
		function onUseResult(result)				{	console.log("Return Use Item success:" + result.success);		JsToDef.send("onUseResult", result);			}
		function onKongregateInPageLogin()	{	console.log("Event(onKongregateInPageLogin)");			JsToDef.send("onKongregateInPageLogin");	}
		function adsAvailable()							{	console.log("Event(adsAvailable)");									JsToDef.send("adsAvailable");							}
		function adsUnavailable()						{	console.log("Event(adsUnavailable)");								JsToDef.send("adsUnavailable");						}
		function adOpened()									{	console.log("Event(adOpened)");											JsToDef.send("adOpened");									}
		function adCompleted()							{	console.log("Event(adCompleted)");									JsToDef.send("adCompleted");							}
		function adAbandoned()							{	console.log("Event(adAbandoned)");									JsToDef.send("adAbandoned");							}
	</script>
	<script type='text/javascript' src="env.js"></script>
	<script type="module" src="port/main.js"></script>
</body>
</html>
