<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Out of Ruin</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f2dfb6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #boot {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(circle at 50% 35%, #fff5d8 0%, #f1d79e 58%, #d7ad62 100%);
      color: #2c1e0e;
      text-align: center;
      padding: 24px;
      transition: opacity 0.25s ease;
    }
    #boot.hidden { opacity: 0; pointer-events: none; }
    .boot-crest {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(145deg, #f8c444, #cc7a18);
      border: 3px solid #fff3cc;
      box-shadow: 0 8px 20px rgba(74, 44, 12, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 900;
      color: #fffaf0;
    }
    .boot-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #2b1a09;
      text-shadow: 0 2px 0 rgba(255, 248, 224, 0.9);
      line-height: 1.05;
    }
    .boot-sub {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b4416;
    }
    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: manipulation;
    }
  </style>
  <script src="mraid.js" async></script>
  <script type="module" src="./src/main.js"></script>
  <div id="boot" aria-label="Out of Ruin">
    <div class="boot-crest">&#9876;</div>
    <div class="boot-title">OUT OF RUIN</div>
    <div class="boot-sub">Idle Dungeon RPG</div>
  </div>
</head>
<body>
  <canvas id="game"></canvas>
</body>
</html>
